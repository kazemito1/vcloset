<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400">
  <defs>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d98c"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9c7c2c"/>
    </linearGradient>
    <linearGradient id="goldLineH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- anel -->
  <circle cx="280" cy="140" r="86" fill="none" stroke="#141414" stroke-width="2"/>
  <circle cx="280" cy="140" r="78" fill="none" stroke="#d4af37" stroke-opacity="0.55" stroke-width="0.8"/>

  <!-- diamante no topo -->
  <rect x="275.5" y="47" width="9" height="9" transform="rotate(45 280 51.5)" fill="none" stroke="url(#goldH)" stroke-width="1.6"/>
  <path d="M276 47 L280 41 L284 47 L280 53 Z" fill="none" stroke="url(#goldH)" stroke-width="1"/>

  <!-- monograma V -->
  <path d="M242 96 L280 194 L318 96" fill="none" stroke="#141414" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M242 96 L280 194 L318 96" fill="none" stroke="url(#goldH)" stroke-opacity="0.85" stroke-width="1.1" transform="translate(0,-4)" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 194 l2.5 -8 2.5 8 -2.5 8 Z" fill="url(#goldH)"/>

  <!-- wordmark -->
  <text x="284" y="286" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="44"
        letter-spacing="10" fill="#141414">VCLOSET</text>

  <!-- filetes com losango -->
  <rect x="150" y="312" width="100" height="1" fill="url(#goldLineH)"/>
  <rect x="310" y="312" width="100" height="1" fill="url(#goldLineH)"/>
  <rect x="276.8" y="308.8" width="6.4" height="6.4" transform="rotate(45 280 312)" fill="none" stroke="url(#goldH)" stroke-width="1.4"/>
</svg>
