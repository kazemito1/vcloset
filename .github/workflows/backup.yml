name: Backup semanal do banco

on:
  schedule:
    # Todo domingo às 06:00 UTC (03:00 de Brasília)
    - cron: "0 6 * * 0"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Exportar dados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup-db.mjs

      - name: Publicar backup como artefato
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/backup-*.json
          retention-days: 90
